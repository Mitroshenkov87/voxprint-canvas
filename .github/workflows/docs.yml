# Build the docs on every pull request. Publish GitHub Pages on pushes to main.
name: docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ui/shell-migration]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xkb1
      - name: Install
        run: |
          python -m pip install -q uv
          mkdir -p wheels
          curl -fsSL -o wheels/voxprint_common-0.3.1-py3-none-any.whl \
            https://github.com/Mitroshenkov87/voxprint-common/releases/download/v0.3.1/voxprint_common-0.3.1-py3-none-any.whl
          python -c "import hashlib, pathlib; p=pathlib.Path('wheels/voxprint_common-0.3.1-py3-none-any.whl'); d=hashlib.sha256(p.read_bytes()).hexdigest(); e='f14036fc70db07e40e5e5376427cea28c3173a94f1d031997a3259ed0afc91fd'; raise SystemExit(None if d==e else 'voxprint-common 0.3.1 failed the SHA-256 check: '+d)"
          uv venv .venv
          uv pip install --python .venv/bin/python --find-links wheels -e ".[docs]"
      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/python tools/render_cli_docs.py
          .venv/bin/python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
