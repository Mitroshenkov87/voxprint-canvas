# Unit tests. No GPU and no generation weights.
name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xkb1
      - name: Install
        shell: bash
        run: |
          python -m pip install -q uv
          uv venv .venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            uv pip install --python .venv/Scripts/python.exe -e ".[dev]"
          else
            uv pip install --python .venv/bin/python -e ".[dev]"
          fi
      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            .venv/Scripts/python.exe -m pytest
          else
            .venv/bin/python -m pytest
          fi
  enlarge-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xkb1
      - name: Install
        run: |
          python -m pip install -q uv
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Check the pinned Enlarge release
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python tools/check_enlarge_release.py
  library-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch and the generation stack
        run: |
          python -m pip install -q uv
          uv venv .venv
          uv pip install --python .venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -c constraints.txt \
            -e ".[dev,gen]"
      - name: Encoder compatibility
        env:
          VOXPRINT_REQUIRE_GEN: "1"
        run: .venv/bin/python -m pytest tests/test_transformers_compat.py
  gate-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the small content-check models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/voxprint-gate
          key: gate-models-v1-${{ hashFiles('canvas/models/catalog.json') }}
          restore-keys: gate-models-v1-
      - name: Install the pinned CPU stack
        run: |
          python -m pip install -q uv
          uv venv .venv
          uv pip install --python .venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -c constraints.txt \
            -e ".[dev,gen]"
      - name: Download the small content-check models
        env:
          VOXPRINT_HOME: /home/runner/.cache/voxprint-gate
        run: |
          .venv/bin/python -c "from canvas.models.provision import install_supporting; from canvas.models.registry import load_catalog; install_supporting(load_catalog(), print)"
      - name: Real-weight checks
        env:
          VOXPRINT_REQUIRE_GATE: "1"
          VOXPRINT_HOME: /home/runner/.cache/voxprint-gate
        run: .venv/bin/python -m pytest tests/test_gate_weights.py
  enhance-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the Qwen3-4B text encoder
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/voxprint-enhance
          key: enhance-encoder-v1-${{ hashFiles('canvas/models/catalog.json') }}
          restore-keys: enhance-encoder-v1-
      - name: Install the pinned CPU stack
        run: |
          python -m pip install -q uv
          uv venv .venv
          uv pip install --python .venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -c constraints.txt \
            -e ".[dev,gen]"
      - name: Free disk for the text encoder
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache || true
          df -h /
      - name: Download the text encoder
        env:
          VOXPRINT_HOME: /home/runner/.cache/voxprint-enhance
        run: |
          .venv/bin/python -c "from canvas.infra.paths import models_dir; from canvas.models.registry import load_catalog; from canvas.models.snapshots import download_files; from canvas.pipeline.enhance import encoder_names, turbo_spec; from canvas.models.modes import Tier; spec = turbo_spec(load_catalog(), Tier.GB16); download_files(spec, models_dir(), encoder_names(spec), print)"
      - name: Rewrite a tiny prompt on CPU
        env:
          VOXPRINT_REQUIRE_ENHANCE: "1"
          VOXPRINT_HOME: /home/runner/.cache/voxprint-enhance
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: .venv/bin/python -m pytest tests/test_enhance_weights.py
