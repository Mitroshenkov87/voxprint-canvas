# PyPI is the only general index. torch and torchvision are installed with
# an explicit --index of the CUDA 13.0 wheel index and --index-strategy.
# uv pip rejects a sources table in a uv.toml ("sources is only applicable
# in the context of a project"), so the pin lives on the install command.
index-url = "https://pypi.org/simple"

[[index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
