[project]
name = "voxprint-canvas"
version = "0.1.0"
description = "Local text-to-image generation for the Voxprint AI Media Suite."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Aleksandr Mitroshenkov" }]
dependencies = [
    "PySide6>=6.8",
    "numpy>=2",
    "pillow>=11.3",
    "imagecodecs>=2024.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "opencv-python-headless>=4.11"]
# MkDocs is BSD-2-Clause. Material is MIT. mkdocstrings and Griffe are ISC.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26,<2"]
# Generation and safety weights are not installed in CI. The worker imports them only when a pinned model is ready.
gen = [
    "torch>=2.5",
    "diffusers==0.41.0",
    "transformers>=4.51",
    "torchao>=0.6",
    "opencv-python-headless>=4.11",
    "pillow>=11",
    "imagecodecs>=2024.12",
]

[project.scripts]
voxprint-canvas = "canvas.app.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canvas*"]

[tool.setuptools.package-data]
"canvas.models" = ["catalog.json", "third_party.json", "turbo_transformer_index.json"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["canvas", "tests", "tools"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-module = false
ignore-nested-functions = true
ignore-private = true
ignore-semiprivate = true
fail-under = 65
color = false
omit-covered-files = true
