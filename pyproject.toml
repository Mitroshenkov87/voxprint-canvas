[project]
name = "voxprint-canvas"
version = "0.1.0"
description = "Local text-to-image generation for the Voxprint AI Media Suite."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Aleksandr Mitroshenkov" }]
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]
# Generation and safety weights are not installed in CI. The worker imports them only when a pinned model is ready.
gen = [
    "torch>=2.5",
    "diffusers==0.41.0",
    "transformers>=4.51",
    "torchao>=0.6",
    "opencv-python-headless>=4.11",
    "pillow>=11",
    "imagecodecs>=2024.12",
]

[project.scripts]
voxprint-canvas = "canvas.app.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canvas*"]

[tool.setuptools.package-data]
"canvas.models" = ["catalog.json"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["canvas", "tests", "tools"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
